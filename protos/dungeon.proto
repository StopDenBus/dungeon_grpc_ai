syntax = "proto3";

package dungeon;

// Service Definition für Multi-User Dungeon
service DungeonService {
    // Spieler Management
    rpc RegisterPlayer(RegisterPlayerRequest) returns (RegisterPlayerResponse);
    rpc UnregisterPlayer(UnregisterPlayerRequest) returns (UnregisterPlayerResponse);
    rpc MovePlayer(MovePlayerRequest) returns (MovePlayerResponse);
    rpc GetPlayerInfo(GetPlayerInfoRequest) returns (PlayerInfo);

    // Raum Information
    rpc GetRoomInfo(GetRoomInfoRequest) returns (RoomInfo);
    rpc LookAround(LookAroundRequest) returns (LookAroundResponse);

    // Interaktionen
    rpc TakeItem(TakeItemRequest) returns (TakeItemResponse);
    rpc DropItem(DropItemRequest) returns (DropItemResponse);
    rpc TalkToNPC(TalkToNPCRequest) returns (TalkToNPCResponse);
    rpc AttackNPC(AttackNPCRequest) returns (AttackNPCResponse);

    // Kisten/Container
    rpc OpenChest(OpenChestRequest) returns (OpenChestResponse);
    rpc CloseChest(CloseChestRequest) returns (CloseChestResponse);
    rpc PutInChest(PutInChestRequest) returns (PutInChestResponse);
    rpc GetFromChest(GetFromChestRequest) returns (GetFromChestResponse);
    rpc InspectChest(InspectChestRequest) returns (InspectChestResponse);

    // Magie System
    rpc ReadScroll(ReadScrollRequest) returns (ReadScrollResponse);
    rpc CastSpell(CastSpellRequest) returns (CastSpellResponse);
    rpc ListSpellbook(ListSpellbookRequest) returns (ListSpellbookResponse);

    // Messaging
    rpc SendDirectMessage(SendDirectMessageRequest) returns (SendMessageResponse);
    rpc SendRoomMessage(SendRoomMessageRequest) returns (SendMessageResponse);
    rpc SendBroadcastMessage(SendBroadcastMessageRequest) returns (SendMessageResponse);
    rpc GetOnlinePlayers(GetOnlinePlayersRequest) returns (GetOnlinePlayersResponse);

    // Events Stream (Server-to-Client)
    rpc StreamEvents(StreamEventsRequest) returns (stream GameEvent);
}

// Messages
message RegisterPlayerRequest {
    string player_name = 1;
    string password = 2;
}

message RegisterPlayerResponse {
    string player_id = 1;
    string message = 2;
    bool success = 3;
}

message UnregisterPlayerRequest {
    string player_id = 1;
}

message UnregisterPlayerResponse {
    bool success = 1;
    string message = 2;
}

message MovePlayerRequest {
    string player_id = 1;
    string direction = 2;  // north, south, east, west
}

message MovePlayerResponse {
    bool success = 1;
    string message = 2;
    RoomInfo new_room = 3;
}

message GetPlayerInfoRequest {
    string player_id = 1;
}

message PlayerInfo {
    string player_id = 1;
    string name = 2;
    string current_room_id = 3;
    int32 health = 4;
    repeated Item inventory = 5;
    int32 magic = 6;
}

message GetRoomInfoRequest {
    string player_id = 1;
}

message RoomInfo {
    string room_id = 1;
    string name = 2;
    string description = 3;
    repeated string exits = 4;  // Verfügbare Richtungen
    repeated Item items = 5;
    repeated NPC npcs = 6;
    repeated string players = 7;  // Namen anderer Spieler
    repeated Chest chests = 8;  // Kisten im Raum
}

message LookAroundRequest {
    string player_id = 1;
}

message LookAroundResponse {
    RoomInfo room = 1;
}

message TakeItemRequest {
    string player_id = 1;
    string item_id = 2;
}

message TakeItemResponse {
    bool success = 1;
    string message = 2;
}

message DropItemRequest {
    string player_id = 1;
    string item_id = 2;
}

message DropItemResponse {
    bool success = 1;
    string message = 2;
}

message TalkToNPCRequest {
    string player_id = 1;
    string npc_id = 2;
}

message TalkToNPCResponse {
    bool success = 1;
    string message = 2;
    string npc_response = 3;
}

message AttackNPCRequest {
    string player_id = 1;
    string npc_id = 2;
}

message AttackNPCResponse {
    bool success = 1;
    string message = 2;
    int32 damage_dealt = 3;
    int32 npc_health_remaining = 4;
}

message StreamEventsRequest {
    string player_id = 1;
}

message GameEvent {
    enum EventType {
        PLAYER_JOINED = 0;
        PLAYER_LEFT = 1;
        PLAYER_MOVED = 2;
        ITEM_TAKEN = 3;
        ITEM_DROPPED = 4;
        NPC_ATTACKED = 5;
        NPC_DIED = 6;
        DIRECT_MESSAGE = 7;
        ROOM_MESSAGE = 8;
        BROADCAST_MESSAGE = 9;
        CHEST_OPENED = 10;
        CHEST_CLOSED = 11;
        ITEM_PUT_IN_CHEST = 12;
        ITEM_TAKEN_FROM_CHEST = 13;
        SPELL_LEARNED = 14;
        SPELL_CAST = 15;
    }

    EventType event_type = 1;
    string message = 2;
    string room_id = 3;
    int64 timestamp = 4;
    string sender_name = 5;
}

// Messaging
message SendDirectMessageRequest {
    string sender_id = 1;
    string recipient_name = 2;
    string message = 3;
}

message SendRoomMessageRequest {
    string sender_id = 1;
    string message = 2;
}

message SendBroadcastMessageRequest {
    string sender_id = 1;
    string message = 2;
}

message SendMessageResponse {
    bool success = 1;
    string message = 2;
}

message GetOnlinePlayersRequest {
    string player_id = 1;
}

message GetOnlinePlayersResponse {
    repeated PlayerStatus players = 1;
}

message PlayerStatus {
    string name = 1;
    string room_name = 2;
    bool is_online = 3;
}

// Data Models
message Item {
    string item_id = 1;
    string name = 2;
    string description = 3;
    int32 value = 4;
}

message NPC {
    string npc_id = 1;
    string name = 2;
    string description = 3;
    int32 health = 4;
    bool is_hostile = 5;
    string dialogue = 6;
    int32 magic = 7;
}

message Chest {
    string chest_id = 1;
    string name = 2;
    string description = 3;
    bool is_open = 4;
    repeated Item items = 5;
}

// Chest Operations
message OpenChestRequest {
    string player_id = 1;
    string chest_name = 2;
}

message OpenChestResponse {
    bool success = 1;
    string message = 2;
}

message CloseChestRequest {
    string player_id = 1;
    string chest_name = 2;
}

message CloseChestResponse {
    bool success = 1;
    string message = 2;
}

message PutInChestRequest {
    string player_id = 1;
    string item_name = 2;
    string chest_name = 3;
}

message PutInChestResponse {
    bool success = 1;
    string message = 2;
}

message GetFromChestRequest {
    string player_id = 1;
    string item_name = 2;
    string chest_name = 3;
}

message GetFromChestResponse {
    bool success = 1;
    string message = 2;
}

message InspectChestRequest {
    string player_id = 1;
    string chest_name = 2;
}

message InspectChestResponse {
    bool success = 1;
    string message = 2;
    Chest chest = 3;
}

// Magie System Messages
message ReadScrollRequest {
    string player_id = 1;
    string item_name = 2;
}

message ReadScrollResponse {
    bool success = 1;
    string message = 2;
}

message CastSpellRequest {
    string player_id = 1;
    string spell_name = 2;
    string target_id = 3;  // Optional: NPC ID für Angriffszauber
}

message CastSpellResponse {
    bool success = 1;
    string message = 2;
    int32 damage_dealt = 3;
    int32 target_health_remaining = 4;
}

message ListSpellbookRequest {
    string player_id = 1;
}

message ListSpellbookResponse {
    repeated Spell spells = 1;
}

message Spell {
    string name = 1;
    string description = 2;
    int32 mana_cost = 3;
    int32 damage = 4;
    string effect_type = 5;
}
